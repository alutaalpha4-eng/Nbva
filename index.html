<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>NBVA School Management</title>
<link rel="icon" type="image/jpeg" href="logo.jpg">
<style>
:root{--bg:#f2f5f8;--cd:#fff;--tx:#14213d;--mu:#64708a;--bd:#dde3ec;--ac:#0f766e;--ac2:#e3f2f0;--bad:#b42318;--bad2:#fde8e6;--ok:#067647;--wn:#b45309;--wn2:#fef3e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1522;--cd:#17212f;--tx:#e6ebf4;--mu:#93a0b8;--bd:#2a3649;--ac:#35c4b4;--ac2:#14322f;--bad:#ff8a80;--bad2:#3a1b1a;--ok:#5fd39a;--wn:#f6b35c;--wn2:#3a2a12}}
:root[data-theme="dark"]{--bg:#0e1522;--cd:#17212f;--tx:#e6ebf4;--mu:#93a0b8;--bd:#2a3649;--ac:#35c4b4;--ac2:#14322f;--bad:#ff8a80;--bad2:#3a1b1a;--ok:#5fd39a;--wn:#f6b35c;--wn2:#3a2a12}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:"Iowan Old Style",Georgia,serif;font-weight:600;margin:0}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--bd);background:var(--cd);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
header h1{font-size:20px}header small{color:var(--mu);display:block;font:13px system-ui}
nav{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:10px;flex-wrap:wrap}
nav button{border:0;background:none;color:var(--mu);padding:7px 14px;border-radius:7px;font:inherit;cursor:pointer}
nav button.on{background:var(--cd);color:var(--ac);font-weight:600;box-shadow:0 0 0 1px var(--bd)}
main{max-width:1080px;margin:0 auto;padding:20px}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.k{flex:1 1 150px;background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.k b{display:block;font:600 26px Georgia,serif}.k span{color:var(--mu);font-size:13px}
.p{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}
.p h2{font-size:18px;margin-bottom:10px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px}
.g2>.p{margin:0}
select,input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:7px 10px;max-width:100%}
input.n{width:80px}
button.b{background:var(--ac);color:#fff;border:0;border-radius:7px;padding:7px 14px;font:inherit;cursor:pointer}
a.b{display:inline-block;background:var(--ac);color:#fff;border-radius:7px;padding:7px 14px;text-decoration:none;font:inherit}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.b,:root:not([data-theme="light"]) a.b{color:#06201d}}
button.b:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mu);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.r{text-align:right}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.bar i{flex:0 0 140px;font-style:normal;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar div{flex:1;background:var(--bg);border-radius:5px;height:14px;overflow:hidden}
.bar div u{display:block;height:100%;background:var(--ac)}
.bar em{flex:0 0 46px;font-style:normal;text-align:right}
.t{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--ac2);color:var(--ac)}
.t.ok{background:var(--ac2);color:var(--ok)}.t.bad{background:var(--bad2);color:var(--bad)}.t.wn{background:var(--wn2);color:var(--wn)}
.mu{color:var(--mu)}.ok{color:var(--ok)}.bd{color:var(--bad)}
.hit{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--bd);padding:8px 4px;color:var(--tx);font:inherit;cursor:pointer}
.hit:hover{background:var(--bg)}
.msg{background:var(--ac2);color:var(--ac);padding:8px 12px;border-radius:7px;margin-bottom:12px}
svg text{fill:var(--mu);font:11px system-ui}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{color-scheme:light dark}
button,a.b,select{touch-action:manipulation}
.sc{-webkit-overflow-scrolling:touch}
input[type=checkbox]{width:18px;height:18px;vertical-align:middle}
@media (pointer:coarse){button.b,a.b,select,input:not([type=checkbox]):not([type=file]){min-height:44px}button.b,a.b{display:inline-flex;align-items:center;justify-content:center}nav button{min-height:44px}input[type=checkbox]{width:22px;height:22px}.hit{min-height:48px}}
@media (hover:none){.hit:hover{background:none}}
@media (max-width:760px){header{padding:10px 14px}nav{width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav button{flex:0 0 auto;white-space:nowrap}main{padding:12px}.p{padding:12px}input,select,textarea{font-size:16px}.row>input:not([type=checkbox]):not([type=file]),.row>select{flex:1 1 140px!important;width:auto!important;min-width:0}.k b{font-size:22px}.bar i{flex-basis:100px}table{font-size:13px}th,td{padding:6px}.g2{gap:12px}}
@media (max-width:420px){.k{flex:1 1 130px}.row>button.b{flex:1 1 100%}}
@media (min-width:1280px){main{max-width:1200px}}
@media print{html:root:root:root{--bg:#fff;--cd:#fff;--tx:#000;--mu:#444;--bd:#999;--ac:#0f766e;--ac2:#fff;--ok:#067647;--bad:#b42318;--bad2:#fff;--wn:#b45309;--wn2:#fff}header{display:none}main>*:not(.pw){display:none!important}main{padding:0;max-width:none}.pw{border:0;padding:0;margin:0;background:#fff}.rcpt{break-inside:avoid;break-after:page;margin:0!important}.rcpt:last-child{break-after:auto}.np{display:none!important}.slip{break-after:page;break-inside:avoid;margin:0!important}.slip:last-child{break-after:auto}body{background:#fff;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media print{.lslip{break-inside:avoid;margin:0 0 12px!important}}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:46px;height:46px;object-fit:contain;border-radius:8px;background:#fff;padding:2px;flex:none}
.rcpt{position:relative;isolation:isolate;overflow:hidden}
.wm{position:absolute;left:50%;top:50%;width:min(72%,380px);transform:translate(-50%,-50%);opacity:.09;z-index:-1;pointer-events:none;user-select:none}
@media print{.logo,.wm{-webkit-print-color-adjust:exact;print-color-adjust:exact}.wm{opacity:.1}}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;font-size:14px}#toast.bad{background:var(--bad);color:#fff}
</style></head>
<body>
<header><div class="brand"><img class="logo" src="logo.jpg" alt="Nyota Buena Vista Academy logo" width="46" height="46"><div><h1 id="sn">NBVA School</h1><small id="who"></small></div></div>
<nav id="nav"></nav></header>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>This site needs JavaScript to run.</noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body></html>
